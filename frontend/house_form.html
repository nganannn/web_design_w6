<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Prediction</title>
</head>

<body>

    <h1>House Price Prediction</h1>

    <form id="house-form">

        <div>
            <label for="area">Area (m²):</label>
            <input
                type="number"
                id="area"
                name="area"
                step="0.1"
                required
            >
        </div>

        <br>

        <div>
            <label for="bedrooms">Bedrooms:</label>
            <input
                type="number"
                id="bedrooms"
                name="bedrooms"
                required
            >
        </div>

        <br>

        <div>
            <label for="location">Location:</label>

            <select id="location" name="location">
                <option value="other">Other</option>
                <option value="hanoi">Hanoi</option>
                <option value="hcmc">HCMC</option>
            </select>
        </div>

        <br>

        <button type="submit">Predict Price</button>

    </form>

    <h2 id="result"></h2>

    <script>
        const form = document.getElementById("house-form");
        const result = document.getElementById("result");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const area = document.getElementById("area").value;
            const bedrooms = document.getElementById("bedrooms").value;
            const location = document.getElementById("location").value;

            const url =
                `/predict?area=${area}&bedrooms=${bedrooms}&location=${location}`;

            try {
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("Request failed");
                }

                const data = await response.json();

                const formattedPrice =
                    Number(data.predicted_price).toLocaleString("en-US");

                result.textContent =
                    `Predicted Price: ${formattedPrice} VND`;

            } catch (error) {
                console.error(error);
                result.textContent = "Unable to predict price.";
            }
        });
    </script>

</body>

</html>
